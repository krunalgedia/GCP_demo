name: Terraform testing

on:
  # push:
  #   branches: ["main"]
  # pull_request:
  workflow_dispatch:   # 👈 enables manual trigger

jobs:
  terraform:
    name: Terraform
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
    # Step 1: Checkout repository
    - name: Checkout
      uses: actions/checkout@v4

    # Step 2: Setup Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    # Step 3: Authenticate to GCP and run Terraform
    - name: Terraform all in one
      run: |
        # Authenticate using service account key (preserves newlines)
        cat <<EOF > /tmp/key.json
        ${{ secrets.GCP_SA_KEY }}
        EOF
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/key.json

        # Optional: test access to GCS backend
        echo "test" > /tmp/test.txt
        gsutil cp /tmp/test.txt gs://tf-backend-githubaction/ || echo "Skipping GCS write test"

        # Initialize Terraform backend
        terraform init

        # Terraform Plan
        terraform plan -input=false

        # Terraform Apply
        terraform apply -auto-approve -input=false

